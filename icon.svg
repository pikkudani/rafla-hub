<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1008;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0b0806;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="192" height="192" fill="url(#bgGrad)"/>
  
  <!-- Outer gold circle -->
  <circle cx="96" cy="96" r="85" fill="#c8922a" opacity="0.95"/>
  
  <!-- Inner cream circle -->
  <circle cx="96" cy="96" r="75" fill="#fdf6ec"/>
  
  <!-- Game icons grid -->
  <!-- Top left: Mask/Charades -->
  <text x="50" y="55" font-size="32" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1a1008">🎭</text>
  
  <!-- Top right: Beer/Drinks -->
  <text x="142" y="55" font-size="32" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1a1008">🍺</text>
  
  <!-- Bottom left: Chef -->
  <text x="50" y="137" font-size="32" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1a1008">👨‍🍳</text>
  
  <!-- Bottom right: Plate -->
  <text x="142" y="137" font-size="32" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#1a1008">🍽️</text>
  
  <!-- Center gold circle with G -->
  <circle cx="96" cy="96" r="32" fill="#c8922a"/>
  <text x="96" y="104" font-size="42" font-weight="bold" text-anchor="middle" dominant-baseline="middle" fill="#fdf6ec" font-family="Playfair Display, serif">G</text>
</svg>
