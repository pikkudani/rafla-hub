<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#c8922a">
<meta name="description" content="Tapahtumakalenteri – Rafla-hub">
<title>Tapahtumat – Rafla-hub</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1a1008;
  --cream: #fdf6ec;
  --gold: #c8922a;
  --rust: #b94a2c;
  --sage: #4a6741;
  --smoke: #e8dfd0;
  --beer: #d4a820;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: linear-gradient(180deg, #120d09 0%, #0b0806 100%);
  color: var(--cream);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0.8rem 0.8rem 2rem;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
}
.container {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 480px;
  display: flex;
  flex-direction: column;
  gap: 0.9rem;
}

/* HEADER */
.page-header {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  width: 100%;
  padding-top: 0.4rem;
}
.back-btn {
  background: transparent;
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 10px;
  color: var(--smoke);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.85rem;
  padding: 0.5rem 0.9rem;
  cursor: pointer;
  transition: border-color 0.2s;
  white-space: nowrap;
  min-height: 40px;
  display: flex;
  align-items: center;
  gap: 0.3rem;
}
.back-btn:hover { border-color: rgba(255,255,255,0.35); }
.page-title-wrap { flex: 1; }
.page-label { font-size: 0.62rem; letter-spacing: 0.28em; text-transform: uppercase; color: var(--gold); opacity: 0.8; }
.page-title { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 700; line-height: 1; }

/* DIVIDER */
.section-divider {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  font-size: 0.62rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.3);
}
.section-divider::before, .section-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: rgba(255,255,255,0.08);
}

/* EVENT ITEM */
.event-item {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.09);
  border-radius: 16px;
  padding: 1rem 1.1rem;
  display: flex;
  gap: 1rem;
  align-items: flex-start;
  transition: border-color 0.2s;
  position: relative;
  overflow: hidden;
}
.event-item.upcoming {
  background: rgba(200,146,42,0.06);
  border-color: rgba(200,146,42,0.25);
}
.event-item.upcoming::before {
  content: '';
  position: absolute;
  top: 0; left: 0; bottom: 0;
  width: 3px;
  background: var(--gold);
  border-radius: 3px 0 0 3px;
}
.event-item.next-up {
  background: rgba(200,146,42,0.1);
  border-color: rgba(200,146,42,0.45);
}
.event-item.next-up::before {
  background: linear-gradient(180deg, var(--gold), var(--beer));
}
.event-item.past {
  opacity: 0.45;
}

/* DATE BADGE */
.date-badge {
  display: flex;
  flex-direction: column;
  align-items: center;
  min-width: 40px;
  padding-top: 0.1rem;
}
.date-badge-day {
  font-family: 'Playfair Display', serif;
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--gold);
  line-height: 1;
}
.date-badge-month {
  font-size: 0.62rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.4);
  margin-top: 0.1rem;
}
.date-badge-weekday {
  font-size: 0.6rem;
  color: rgba(255,255,255,0.3);
  margin-top: 0.05rem;
}

/* EVENT DETAILS */
.event-details { flex: 1; min-width: 0; }
.event-name {
  font-family: 'Playfair Display', serif;
  font-size: 1rem;
  font-weight: 700;
  color: var(--cream);
  line-height: 1.2;
  margin-bottom: 0.3rem;
}
.event-meta {
  font-size: 0.73rem;
  color: rgba(255,255,255,0.45);
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem 0.8rem;
  margin-bottom: 0.3rem;
}
.event-meta span { display: flex; align-items: center; gap: 0.25rem; }
.event-desc {
  font-size: 0.78rem;
  color: rgba(255,255,255,0.55);
  line-height: 1.4;
  margin-top: 0.35rem;
}
.next-badge {
  font-size: 0.58rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  background: var(--gold);
  color: var(--ink);
  border-radius: 999px;
  padding: 0.15rem 0.55rem;
  font-weight: 600;
  display: inline-block;
  margin-bottom: 0.35rem;
}

/* EMPTY / LOADING */
.state-msg {
  text-align: center;
  padding: 2rem 1rem;
  color: rgba(255,255,255,0.3);
  font-size: 0.85rem;
  line-height: 1.6;
}
.state-msg .emoji { font-size: 2rem; display: block; margin-bottom: 0.5rem; }

/* SHEETS LINK */
.sheets-link {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  font-size: 0.75rem;
  color: rgba(255,255,255,0.3);
  text-decoration: none;
  padding: 0.5rem;
  border-radius: 8px;
  transition: color 0.2s;
  margin-top: 0.5rem;
}
.sheets-link:hover { color: var(--gold); }

@media (min-width: 769px) {
  .container { max-width: 600px; }
}
</style>
</head>
<body>
<div class="container">

  <!-- HEADER -->
  <div class="page-header">
    <button class="back-btn" onclick="history.back()">← Takaisin</button>
    <div class="page-title-wrap">
      <div class="page-label">Rafla-hub</div>
      <div class="page-title">Tapahtumat 📅</div>
    </div>
  </div>

  <!-- EVENTS LIST -->
  <div id="events-list">
    <div class="state-msg">
      <span class="emoji">⏳</span>
      Ladataan tapahtumia...
    </div>
  </div>

  <!-- EDIT LINK -->
  <a class="sheets-link"
     href="https://docs.google.com/spreadsheets/d/e/2PACX-1vSH9auBOsunzAfI2apVjgL_h2p6wM6MN4b0FePtaaxPbgGRTj1I44VqoVlQsvnGDtceLIZ6WOq_idUO/pubhtml"
     target="_blank" rel="noopener">
    ✏️ Muokkaa tapahtumia Google Sheetsistä
  </a>

</div>

<script>
const SHEET_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSH9auBOsunzAfI2apVjgL_h2p6wM6MN4b0FePtaaxPbgGRTj1I44VqoVlQsvnGDtceLIZ6WOq_idUO/pub?output=csv';

const WEEKDAYS = ['Su','Ma','Ti','Ke','To','Pe','La'];
const MONTHS_LONG = ['tammikuu','helmikuu','maaliskuu','huhtikuu','toukokuu','kesäkuu','heinäkuu','elokuu','syyskuu','lokakuu','marraskuu','joulukuu'];
const MONTHS_SHORT = ['tam','hel','maa','huh','tou','kes','hei','elo','syy','lok','mar','jou'];

function parseCSV(text) {
  const lines = text.trim().split('\n');
  if (lines.length < 2) return [];
  const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g,''));
  return lines.slice(1).map(line => {
    const cols = [];
    let cur = '', inQ = false;
    for (let ch of line) {
      if (ch === '"') inQ = !inQ;
      else if (ch === ',' && !inQ) { cols.push(cur.trim()); cur = ''; }
      else cur += ch;
    }
    cols.push(cur.trim());
    const obj = {};
    headers.forEach((h, i) => obj[h] = (cols[i] || '').replace(/^"|"$/g,''));
    return obj;
  });
}

function parseDate(row) {
  const raw = (row['Päivämäärä'] || row['Paivamaara'] || row['Date'] || '').trim();
  if (!raw) return null;
  let d;
  if (/^\d{1,2}\.\d{1,2}\.\d{4}$/.test(raw)) {
    const [day, month, year] = raw.split('.');
    d = new Date(parseInt(year), parseInt(month) - 1, parseInt(day));
  } else {
    d = new Date(raw);
  }
  return isNaN(d) ? null : d;
}

function renderEvents(rows) {
  const list = document.getElementById('events-list');
  const today = new Date(); today.setHours(0,0,0,0);

  const events = rows
    .map(r => ({ ...r, _date: parseDate(r) }))
    .filter(r => r._date)
    .sort((a, b) => a._date - b._date);

  if (!events.length) {
    list.innerHTML = `<div class="state-msg"><span class="emoji">📭</span>Ei tapahtumia taulukossa vielä.<br>Lisää tapahtumia Google Sheetsiin!</div>`;
    return;
  }

  const upcoming = events.filter(e => e._date >= today);
  const past = events.filter(e => e._date < today).reverse();

  let html = '';

  if (upcoming.length) {
    html += `<div class="section-divider">Tulevat tapahtumat</div>`;
    upcoming.forEach((ev, i) => {
      const d = ev._date;
      const name = ev['Nimi'] || ev['Name'] || 'Tapahtuma';
      const aika = ev['Aika'] || ev['Time'] || '';
      const paikka = ev['Paikka'] || ev['Location'] || '';
      const kuvaus = ev['Kuvaus'] || ev['Description'] || '';
      const isNext = i === 0;

      html += `
        <div class="event-item ${isNext ? 'next-up' : 'upcoming'}">
          <div class="date-badge">
            <div class="date-badge-day">${d.getDate()}</div>
            <div class="date-badge-month">${MONTHS_SHORT[d.getMonth()]}</div>
            <div class="date-badge-weekday">${WEEKDAYS[d.getDay()]}</div>
          </div>
          <div class="event-details">
            ${isNext ? '<span class="next-badge">Seuraava</span>' : ''}
            <div class="event-name">${name}</div>
            <div class="event-meta">
              ${aika ? `<span>🕐 ${aika}</span>` : ''}
              ${paikka ? `<span>📍 ${paikka}</span>` : ''}
            </div>
            ${kuvaus ? `<div class="event-desc">${kuvaus}</div>` : ''}
          </div>
        </div>`;
    });
  }

  if (past.length) {
    html += `<div class="section-divider" style="margin-top:0.5rem">Menneet tapahtumat</div>`;
    past.forEach(ev => {
      const d = ev._date;
      const name = ev['Nimi'] || ev['Name'] || 'Tapahtuma';
      const aika = ev['Aika'] || ev['Time'] || '';
      const paikka = ev['Paikka'] || ev['Location'] || '';
      const kuvaus = ev['Kuvaus'] || ev['Description'] || '';

      html += `
        <div class="event-item past">
          <div class="date-badge">
            <div class="date-badge-day">${d.getDate()}</div>
            <div class="date-badge-month">${MONTHS_SHORT[d.getMonth()]}</div>
            <div class="date-badge-weekday">${WEEKDAYS[d.getDay()]}</div>
          </div>
          <div class="event-details">
            <div class="event-name">${name}</div>
            <div class="event-meta">
              ${aika ? `<span>🕐 ${aika}</span>` : ''}
              ${paikka ? `<span>📍 ${paikka}</span>` : ''}
            </div>
            ${kuvaus ? `<div class="event-desc">${kuvaus}</div>` : ''}
          </div>
        </div>`;
    });
  }

  if (!upcoming.length && !past.length) {
    list.innerHTML = `<div class="state-msg"><span class="emoji">📭</span>Ei tapahtumia vielä.</div>`;
    return;
  }

  list.innerHTML = html;
}

async function loadEvents() {
  try {
    const res = await fetch(SHEET_CSV);
    const text = await res.text();
    const rows = parseCSV(text);
    renderEvents(rows);
  } catch(e) {
    document.getElementById('events-list').innerHTML =
      `<div class="state-msg"><span class="emoji">❌</span>Tapahtumia ei voitu ladata.<br>Tarkista verkkoyhteys.</div>`;
  }
}

loadEvents();
</script>
</body>
</html>
